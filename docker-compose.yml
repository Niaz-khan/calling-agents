services:
  postgres:
    image: postgres:17
    container_name: call-agent-postgres
    restart: unless-stopped
    network_mode: host

    environment:
      POSTGRES_DB: callagent
      POSTGRES_USER: callagent
      POSTGRES_PASSWORD: callagent

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
